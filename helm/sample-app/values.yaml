replicaCount: 1

image:
  repository: public.ecr.aws/nginx/nginx
  tag: "1.27.0-alpine"
  pullPolicy: IfNotPresent

environment: default

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

probes:
  readiness:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 15

service:
  type: ClusterIP
  port: 80
