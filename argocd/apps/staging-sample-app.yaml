apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-sample-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/KrishnaaCloud/eks-platform.git
    targetRevision: phase-2-gitops
    path: helm/sample-app
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
