apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sample-app-slo-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: sample-app-slo-rules
    role: alert-rules
spec:
  groups:
    - name: sample-app-availability-slo
      rules:
        # SLI Recording Rules across multiple evaluation windows
        - record: job:sample_app_availability:ratio_rate2m
          expr: avg_over_time(probe_success{job="blackbox-dev-sample-app"}[2m])
        - record: job:sample_app_availability:ratio_rate5m
          expr: avg_over_time(probe_success{job="blackbox-dev-sample-app"}[5m])
        - record: job:sample_app_availability:ratio_rate10m
          expr: avg_over_time(probe_success{job="blackbox-dev-sample-app"}[10m])
        - record: job:sample_app_availability:ratio_rate30m
          expr: avg_over_time(probe_success{job="blackbox-dev-sample-app"}[30m])

        # Burn Rate Recording Rules: (1 - SLI) / (1 - 0.99)
        - record: job:sample_app_availability:burn_rate2m
          expr: (1 - job:sample_app_availability:ratio_rate2m) / 0.01
        - record: job:sample_app_availability:burn_rate5m
          expr: (1 - job:sample_app_availability:ratio_rate5m) / 0.01
        - record: job:sample_app_availability:burn_rate10m
          expr: (1 - job:sample_app_availability:ratio_rate10m) / 0.01
        - record: job:sample_app_availability:burn_rate30m
          expr: (1 - job:sample_app_availability:ratio_rate30m) / 0.01

        # Error Budget Remaining (%) over 30m window
        - record: job:sample_app_availability:error_budget_remaining
          expr: clamp_max(clamp_min((1 - (1 - job:sample_app_availability:ratio_rate30m) / 0.01) * 100, 0), 100)

        # Multi-Window Fast Burn Alert (Critical)
        - alert: SampleAppAvailabilityFastBurn
          expr: |
            (job:sample_app_availability:burn_rate2m > 14.4)
            and
            (job:sample_app_availability:burn_rate10m > 14.4)
          for: 1m
          labels:
            severity: critical
            slo: availability
          annotations:
            summary: "Critical availability error budget burn rate for dev-sample-app"
            description: "The availability error budget is burning at >14.4x rate across both 2m and 10m windows."

        # Multi-Window Slow Burn Alert (Warning)
        - alert: SampleAppAvailabilitySlowBurn
          expr: |
            (job:sample_app_availability:burn_rate5m > 3)
            and
            (job:sample_app_availability:burn_rate30m > 3)
          for: 2m
          labels:
            severity: warning
            slo: availability
          annotations:
            summary: "Elevated availability error budget burn rate for dev-sample-app"
            description: "The availability error budget is burning at >3x rate across both 5m and 30m windows."

    - name: sample-app-latency-slo
      rules:
        # Latency SLI: 95% of probes under 50ms (0.05s)
        - record: job:sample_app_latency:ratio_rate2m
          expr: avg_over_time((probe_duration_seconds{job="blackbox-dev-sample-app"} < bool 0.05 and probe_success{job="blackbox-dev-sample-app"} == bool 1)[2m:10s])
        - record: job:sample_app_latency:ratio_rate5m
          expr: avg_over_time((probe_duration_seconds{job="blackbox-dev-sample-app"} < bool 0.05 and probe_success{job="blackbox-dev-sample-app"} == bool 1)[5m:10s])
        - record: job:sample_app_latency:ratio_rate10m
          expr: avg_over_time((probe_duration_seconds{job="blackbox-dev-sample-app"} < bool 0.05 and probe_success{job="blackbox-dev-sample-app"} == bool 1)[10m:10s])
        - record: job:sample_app_latency:ratio_rate30m
          expr: avg_over_time((probe_duration_seconds{job="blackbox-dev-sample-app"} < bool 0.05 and probe_success{job="blackbox-dev-sample-app"} == bool 1)[30m:10s])

        # Latency Burn Rate Recording Rules: (1 - Latency_SLI) / (1 - 0.95)
        - record: job:sample_app_latency:burn_rate2m
          expr: (1 - job:sample_app_latency:ratio_rate2m) / 0.05
        - record: job:sample_app_latency:burn_rate5m
          expr: (1 - job:sample_app_latency:ratio_rate5m) / 0.05
        - record: job:sample_app_latency:burn_rate10m
          expr: (1 - job:sample_app_latency:ratio_rate10m) / 0.05
        - record: job:sample_app_latency:burn_rate30m
          expr: (1 - job:sample_app_latency:ratio_rate30m) / 0.05

        # Error Budget Remaining (%) over 30m window
        - record: job:sample_app_latency:error_budget_remaining
          expr: clamp_max(clamp_min((1 - (1 - job:sample_app_latency:ratio_rate30m) / 0.05) * 100, 0), 100)

        # Multi-Window Fast Burn Alert (Critical)
        - alert: SampleAppLatencyFastBurn
          expr: |
            (job:sample_app_latency:burn_rate2m > 14.4)
            and
            (job:sample_app_latency:burn_rate10m > 14.4)
          for: 1m
          labels:
            severity: critical
            slo: latency
          annotations:
            summary: "Critical latency error budget burn rate for dev-sample-app"
            description: "The latency error budget is burning at >14.4x rate across both 2m and 10m windows (probes exceeding 50ms threshold)."

        # Multi-Window Slow Burn Alert (Warning)
        - alert: SampleAppLatencySlowBurn
          expr: |
            (job:sample_app_latency:burn_rate5m > 3)
            and
            (job:sample_app_latency:burn_rate30m > 3)
          for: 2m
          labels:
            severity: warning
            slo: latency
          annotations:
            summary: "Elevated latency error budget burn rate for dev-sample-app"
            description: "The latency error budget is burning at >3x rate across both 5m and 30m windows (probes exceeding 50ms threshold)."
